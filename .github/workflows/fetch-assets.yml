name: Fetch site assets

# Run this once from the Actions tab (Run workflow). It downloads every image, stylesheet,
# script and font the static pages use from bccbengaluru.in and commits them to this branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download assets
        run: python3 scripts/fetch_assets.py
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wp-content wp-includes
          if git diff --cached --quiet; then echo "Nothing new to commit"; exit 0; fi
          git commit -m "Add downloaded site assets"
          git push
